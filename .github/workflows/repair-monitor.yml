name: Repair flip monitor

on:
  schedule:
    # Stagger this separate bot two minutes after the ordinary deal monitor.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a Repair Flip Bot Telegram setup message"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: repair-flip-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    name: Analyze broken phones
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run automated tests on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: python -m unittest discover -s tests -v

      - name: Analyze repair-and-resale opportunities
        env:
          REPAIR_TELEGRAM_BOT_TOKEN: ${{ secrets.REPAIR_TELEGRAM_BOT_TOKEN }}
          REPAIR_TELEGRAM_CHAT_ID: ${{ secrets.REPAIR_TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ inputs.send_test }}
        run: |
          args=(--config repair_config.json --state repair_seen_listings.json)
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$SEND_TEST" == "true" ]]; then
            args+=(--send-test)
          fi
          python repair_main.py "${args[@]}"

      - name: Save repair-bot memory
        if: always()
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- repair_seen_listings.json)" ]]; then
            echo "repair_seen_listings.json did not change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- repair_seen_listings.json
          git commit -m "chore: update repair flip state [skip ci]"

          branch="${GITHUB_REF_NAME}"
          if git push origin "HEAD:${branch}"; then
            exit 0
          fi

          echo "The branch changed during this run; rebasing once and retrying."
          git fetch origin "${branch}"
          git rebase "origin/${branch}"
          git push origin "HEAD:${branch}"
